<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Environment info</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 4px;
      }
      p.hint {
        margin: 0 0 20px;
        opacity: 0.75;
      }
      fieldset {
        border: 1px solid #8884;
        border-radius: 8px;
        margin: 0 0 16px;
        padding: 12px 16px;
      }
      legend {
        font-weight: 600;
        padding: 0 6px;
      }
      label {
        display: block;
        margin: 8px 0 2px;
        font-size: 0.9rem;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 260px;
        font:
          13px/1.4 ui-monospace,
          monospace;
        padding: 8px;
      }
      button {
        font: inherit;
        padding: 8px 18px;
        cursor: pointer;
        margin-top: 8px;
      }
      #status {
        margin-left: 10px;
        color: #2a8a3a;
      }
    </style>
  </head>
  <body>
    <h1>Environment info</h1>
    <p class="hint">
      Keep this browser window maximized (or fullscreen) on the screen you test
      on. Fill in the fields, click Copy, and paste the result. Repeat for your
      other screen by dragging this window over and refreshing the page.
    </p>

    <fieldset>
      <legend>About you (fill in)</legend>
      <label for="name">Name</label>
      <input id="name" autocomplete="name" />
    </fieldset>

    <fieldset>
      <legend>Detected automatically</legend>
      <textarea id="out" readonly></textarea>
      <button id="copy" type="button">Copy</button><span id="status"></span>
    </fieldset>

    <script>
      (function () {
        var $ = function (id) {
          return document.getElementById(id);
        };
        var auto = {};
        var refreshHz = null;

        function measureRefreshRate() {
          var times = [];
          function tick(t) {
            times.push(t);
            if (times.length < 90) return requestAnimationFrame(tick);
            var deltas = [];
            for (var i = 1; i < times.length; i++)
              deltas.push(times[i] - times[i - 1]);
            deltas.sort(function (a, b) {
              return a - b;
            });
            var median = deltas[Math.floor(deltas.length / 2)];
            var hz = 1000 / median;
            var common = [30, 48, 50, 60, 75, 90, 100, 120, 144, 165, 240];
            refreshHz = common.reduce(function (a, b) {
              return Math.abs(b - hz) < Math.abs(a - hz) ? b : a;
            });
            render();
          }
          requestAnimationFrame(tick);
        }

        function parseUA() {
          var ua = navigator.userAgent,
            m;
          var os = /Windows NT 10/.test(ua)
            ? "Windows 10/11"
            : /Mac OS X/.test(ua)
              ? "macOS " +
                ((ua.match(/Mac OS X ([\d_]+)/) || [])[1] || "").replace(
                  /_/g,
                  ".",
                )
              : /Android ([\d.]+)/.test(ua)
                ? "Android " + RegExp.$1
                : /(iPhone|iPad).*OS ([\d_]+)/.test(ua)
                  ? "iOS " + RegExp.$2.replace(/_/g, ".")
                  : /Linux/.test(ua)
                    ? "Linux"
                    : "Unknown";
          var br = (m = ua.match(/Edg\/([\d.]+)/))
            ? "Edge " + m[1]
            : (m = ua.match(/OPR\/([\d.]+)/))
              ? "Opera " + m[1]
              : (m = ua.match(/Firefox\/([\d.]+)/))
                ? "Firefox " + m[1]
                : (m = ua.match(/Chrome\/([\d.]+)/))
                  ? "Chrome " + m[1]
                  : (m = ua.match(/Version\/([\d.]+).*Safari/))
                    ? "Safari " + m[1]
                    : "Unknown";
          return { os: os, browser: br };
        }

        function collect() {
          var p = parseUA();
          var d = {
            name: $("name").value.trim(),
            screen: {
              resolution: screen.width + "x" + screen.height,
              availableResolution: screen.availWidth + "x" + screen.availHeight,
              devicePixelRatio: window.devicePixelRatio,
              refreshRateHz: refreshHz,
              orientation:
                (screen.orientation && screen.orientation.type) ||
                (screen.width >= screen.height ? "landscape" : "portrait"),
              colorDepth: screen.colorDepth,
            },
            viewport: {
              inner: window.innerWidth + "x" + window.innerHeight,
              outer: window.outerWidth + "x" + window.outerHeight,
            },
            machine: {
              os: (auto.platform
                ? auto.platform + " " + (auto.platformVersion || "")
                : p.os
              ).trim(),
              browser: auto.browser || p.browser,
              architecture: auto.architecture || undefined,
              language: navigator.language,
              languages: (navigator.languages || []).join(", "),
              timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
              userAgent: navigator.userAgent,
            },
          };
          return d;
        }

        function render() {
          $("out").value = JSON.stringify(collect(), null, 2);
        }

        function init() {
          if (
            navigator.userAgentData &&
            navigator.userAgentData.getHighEntropyValues
          ) {
            navigator.userAgentData
              .getHighEntropyValues([
                "platform",
                "platformVersion",
                "architecture",
                "fullVersionList",
              ])
              .then(function (v) {
                auto.platform = v.platform;
                auto.platformVersion = v.platformVersion;
                auto.architecture = v.architecture;
                var list = (v.fullVersionList || []).filter(function (b) {
                  return !/Not.?A.?Brand/i.test(b.brand);
                });
                var pick =
                  list.filter(function (b) {
                    return !/^Chromium$/.test(b.brand);
                  })[0] || list[0];
                if (pick) auto.browser = pick.brand + " " + pick.version;
                render();
              })
              .catch(function () {});
          }
          ["name"].forEach(function (id) {
            $(id).addEventListener("input", render);
          });
          window.addEventListener("resize", render);
          $("copy").addEventListener("click", function () {
            var done = function () {
              $("status").textContent = "Copied!";
              setTimeout(function () {
                $("status").textContent = "";
              }, 2000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard
                .writeText($("out").value)
                .then(done, function () {
                  $("out").select();
                  document.execCommand("copy");
                  done();
                });
            } else {
              $("out").select();
              document.execCommand("copy");
              done();
            }
          });
          render();
          measureRefreshRate();
        }
        init();
      })();
    </script>
  </body>
</html>
